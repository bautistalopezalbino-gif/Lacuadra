<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vídeo menú de desayunos</title>
<!-- Escena del vídeo. La pinta fotograma a fotograma render.mjs llamando a window.render(t). -->
<link rel="stylesheet" href="../../fonts/fonts.css">
<!-- logo-video.png es logo.png recortado al dibujo (sin el margen ni la marca suelta de la esquina) -->
<style>
:root{
  --espresso:#432919; --espresso-deep:#2B1A10;
  --cream:#FBF4E9; --on-dark-muted:#E0CDB4;
  --gold:#C98A3C; --gold-bright:#DCA05A;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',Helvetica,Arial,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:1920px; height:1080px; overflow:hidden; background:var(--espresso); }
#stage{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--espresso); color:var(--cream); font-family:var(--sans); }
.scene{ position:absolute; inset:0; overflow:hidden; visibility:hidden; background:var(--espresso); }

.logo{ display:block; background:var(--cream);
  -webkit-mask:url(logo-video.png) center/contain no-repeat; mask:url(logo-video.png) center/contain no-repeat; aspect-ratio:824/722; }
.kicker{ font:500 24px/1 var(--sans); letter-spacing:.3em; text-transform:uppercase; color:var(--gold-bright); }
.rule{ height:3px; background:var(--gold); transform-origin:left; }

/* Intro */
.intro .bg{ position:absolute; inset:0; background:center/cover no-repeat; filter:brightness(.3) saturate(1.05) blur(3px); }
.intro .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.intro .logo{ width:250px; }
.intro .kicker{ margin-top:46px; }
.intro h1{ font:500 188px/1 var(--serif); letter-spacing:-.015em; margin-top:16px; }
.intro .rule{ width:160px; margin-top:34px; transform-origin:center; }

/* Platos: texto a la izquierda, plato a la derecha fundiéndose con el panel */
.dish .bg{ position:absolute; inset:-60px; background:center/cover no-repeat; filter:blur(40px) brightness(.6) saturate(1.1); }
.dish .photo{ position:absolute; top:0; height:1080px; object-fit:cover; object-position:35% 50%; transform-origin:62% 50%; will-change:transform;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 26%); mask-image:linear-gradient(to right,transparent 0,#000 26%); }
.dish.land .photo{ left:620px; width:1300px; }
.dish.vert .photo{ left:740px; width:1180px; transform-origin:50% 50%; }
/* Fotos de móvil pequeñas: enteras a toda altura, sin ampliarlas, sobre su propio fondo desenfocado */
.dish.fit .photo{ left:1030px; width:610px; transform-origin:50% 50%;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%); mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%); }
.dish .shade{ position:absolute; inset:0;
  background:linear-gradient(to right,rgba(43,26,16,.96) 0,rgba(43,26,16,.88) 30%,rgba(43,26,16,.2) 52%,rgba(43,26,16,0) 62%); }
.dish .logo{ position:absolute; top:90px; left:120px; width:150px; }
.dish .txt{ position:absolute; left:120px; width:660px; top:0; bottom:0; padding-top:90px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
.dish h2{ font:500 104px/1 var(--serif); letter-spacing:-.01em; margin-top:22px; text-wrap:balance; }
.dish .rule{ width:110px; margin-top:32px; }
.dish .price{ font:400 60px/1 var(--sans); color:var(--gold-bright); margin-top:28px; letter-spacing:.01em; }
.dish .extra{ font:300 30px/1.3 var(--sans); color:var(--on-dark-muted); margin-top:14px; }

/* Cierre: título a la izquierda, lista a la derecha */
.outro{ background:radial-gradient(90% 120% at 30% 45%,#4F3221 0,var(--espresso) 55%,var(--espresso-deep) 100%); }
.outro .left{ position:absolute; left:120px; top:0; bottom:0; width:620px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
.outro .logo{ width:170px; }
.outro .kicker{ margin-top:60px; }
.outro h2{ font:500 140px/1 var(--serif); letter-spacing:-.01em; margin-top:16px; }
.outro .rule{ width:110px; margin-top:32px; }
.outro .foot{ font:300 30px/1.5 var(--sans); color:var(--on-dark-muted); margin-top:44px; }
.outro .foot b{ font-weight:500; color:var(--cream); }
.outro .sep{ position:absolute; left:830px; top:200px; bottom:200px; width:1px; background:rgba(201,138,60,.35); transform-origin:top; }
.outro ul{ position:absolute; left:930px; right:120px; top:50%; margin-top:-300px; list-style:none; }
.outro li{ display:flex; align-items:baseline; gap:18px; font:300 38px/1 var(--sans); height:75px; }
.outro li .dots{ flex:1; border-bottom:3px dotted rgba(224,205,180,.45); transform:translateY(-8px); }
.outro li .pr{ font-weight:500; color:var(--gold-bright); }
</style>
</head>
<body>
<div id="stage"></div>

<script>
const IMG = {
  tortilla:  '../../pomelli_photoshoot_image_9_16_1016.png',
  esgarraet: '../../pomelli_photoshoot_image_9_16_1016%20(1).png',
  revuelto:  '../../Gemini_Generated_Image_mpkp7umpkp7umpkp.jfif',
  croissant: '../../Gemini_Generated_Image_kjrrpckjrrpckjrr.jfif',
  chips:     '../../Gemini_Generated_Image_cpj345cpj345cpj3.jfif',
  // Fotos reales de la carpeta «Fotos La Cuadra» de Drive
  promo:     '../../Fotos/EAB9B55D-4DE6-4698-82A0-7E4E36BC36E1.jpg',
  intro:     '../../Fotos/IMG_2586.PNG',
};

// Nombres y precios tal cual aparecen en carta.html (sección Desayunos y meriendas).
const PLATOS = [
  { nombre:'Tortilla francesa',           precio:'2,20 €', img:IMG.tortilla,  vert:true, pos:'50% 44%' },
  { nombre:'Huevo revuelto',              precio:'2,50 €', img:IMG.revuelto,  extra:'2 huevos revueltos o francesa · 4,40 €' },
  { nombre:'Croissant york y queso',      precio:'2,80 €', img:IMG.croissant },
  { nombre:'Tosta de esgarraet y queso',  precio:'4,50 €', img:IMG.esgarraet, vert:true, pos:'50% 57%' },
  { nombre:'Mini chips de jamón y queso', precio:'1,50 €', img:IMG.chips },
  { nombre:'Promo croissant',             precio:'2,70 €', img:IMG.promo, fit:true },
];
const LISTA = [
  ['Tortilla francesa','2,20 €'], ['Huevo revuelto','2,50 €'], ['2 huevos revueltos o francesa','4,40 €'],
  ['Croissant york y queso','2,80 €'], ['Tosta de esgarraet y queso','4,50 €'], ['Mini chips de jamón y queso','1,50 €'],
  ['Promo croissant','2,70 €'], ['Promo tostada','2,90 €'],
];

// Tiempos (segundos): lo que cada escena está en pantalla hasta que empieza la siguiente.
// Cada escena entra en fundido sobre la anterior durante XF.
const XF = 0.5, INTRO = 2.7, PLATO = 5, OUTRO = 5;
const stage = document.getElementById('stage');
const scenes = [];
let t0 = 0;
function add(el, slot, anim){ stage.appendChild(el); scenes.push({ el, start:t0, dur:slot + XF, anim }); t0 += slot; }
function h(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

add(h(`<section class="scene intro">
  <div class="bg" style="background-image:url('${IMG.intro}')"></div>
  <div class="col">
    <span class="logo"></span>
    <p class="kicker">Cafetería · Pastelería</p>
    <h1>Desayunos</h1>
    <div class="rule"></div>
  </div></section>`), INTRO, animIntro);

PLATOS.forEach((p, i) => add(h(`<section class="scene dish ${p.fit ? 'fit' : p.vert ? 'vert' : 'land'}">
  <div class="bg" style="background-image:url('${p.img}')"></div>
  <img class="photo" src="${p.img}" alt=""${p.pos ? ` style="object-position:${p.pos}"` : ''}>
  <div class="shade"></div>
  <span class="logo"></span>
  <div class="txt">
    <p class="kicker">Desayunos · 0${i + 1}</p>
    <h2>${p.nombre}</h2>
    <div class="rule"></div>
    <p class="price">${p.precio}</p>
    ${p.extra ? `<p class="extra">${p.extra}</p>` : ''}
  </div></section>`), PLATO, (el, lt, d) => animDish(el, lt, d, i)));

add(h(`<section class="scene outro">
  <div class="left">
    <span class="logo"></span>
    <p class="kicker">La carta</p>
    <h2>Desayunos</h2>
    <div class="rule"></div>
    <p class="foot"><b>C/ dels Campaners, 16</b><br>Patraix, Valencia · @lacuadravalencia</p>
  </div>
  <div class="sep"></div>
  <ul>${LISTA.map(([n, pr]) => `<li><span>${n}</span><span class="dots"></span><span class="pr">${pr}</span></li>`).join('')}</ul></section>`), OUTRO, animOutro);

window.DURATION = t0;

// Utilidades de animación
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const easeInOut = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
// Aparece desde abajo: progreso entre a y a+len segundos.
function rise(el, lt, a, len = .6, dy = 28){
  const k = easeOut((lt - a) / len);
  el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`;
}

function animIntro(el, lt, d){
  const q = s => el.querySelector(s);
  q('.bg').style.transform = `scale(${1.14 - .1 * easeInOut(lt / d)})`;
  const k = easeOut(lt / .9);
  q('.logo').style.opacity = k; q('.logo').style.transform = `scale(${.9 + .1 * k})`;
  rise(q('.kicker'), lt, .55);
  rise(q('h1'), lt, .7, .8, 40);
  q('.rule').style.transform = `scaleX(${easeOut((lt - 1.0) / .7)})`;
}

function animDish(el, lt, d, i){
  const q = s => el.querySelector(s);
  // Zoom lento alternando acercar / alejar
  const z = easeInOut(lt / d), s = i % 2 ? 1.1 - .08 * z : 1.02 + .08 * z;
  q('.photo').style.transform = `scale(${s})`;
  q('.logo').style.opacity = easeOut((lt - .1) / .6);
  rise(q('.kicker'), lt, .25);
  rise(q('h2'), lt, .35, .7, 40);
  q('.rule').style.transform = `scaleX(${easeOut((lt - .55) / .6)})`;
  rise(q('.price'), lt, .6);
  if (q('.extra')) rise(q('.extra'), lt, .8);
  // El texto se va justo antes del fundido para no solaparse con el del plato siguiente
  q('.txt').style.opacity = 1 - easeInOut((lt - (d - XF - .3)) / .35);
}

function animOutro(el, lt){
  const q = s => el.querySelector(s);
  q('.logo').style.opacity = easeOut((lt - .2) / .6);
  rise(q('.kicker'), lt, .3);
  rise(q('h2'), lt, .4, .7, 40);
  q('.rule').style.transform = `scaleX(${easeOut((lt - .7) / .6)})`;
  rise(q('.foot'), lt, .9);
  q('.sep').style.transform = `scaleY(${easeOut((lt - .5) / 1.2)})`;
  el.querySelectorAll('li').forEach((li, j) => rise(li, lt, .8 + j * .12, .5, 22));
}

window.render = t => {
  scenes.forEach((sc, k) => {
    const lt = t - sc.start, next = scenes[k + 1];
    // Oculta lo que aún no ha entrado y lo que ya queda tapado por la siguiente escena
    const visible = lt >= 0 && !(next && t >= next.start + XF);
    sc.el.style.visibility = visible ? 'visible' : 'hidden';
    if (!visible) return;
    sc.el.style.opacity = k === 0 ? 1 : easeInOut(lt / XF);
    sc.anim(sc.el, lt, sc.dur);
  });
};

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  await Promise.all(Object.values(IMG).map(src => { const im = new Image(); im.src = src; return im.decode().catch(() => {}); }));
  render(0);
})();
</script>
</body>
</html>
